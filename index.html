<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Purrkour - a rooftop lullaby</title>
<meta name="description" content="Pounce on the purr. One tap, twenty moonlit rooftops, one small gift for Hana. The coziest way to lose five minutes.">
<meta property="og:title" content="Purrkour - a rooftop lullaby">
<meta property="og:description" content="Pounce on the purr. One tap, twenty moonlit rooftops, one small gift for Hana. The coziest way to lose five minutes.">
<meta property="og:image" content="https://afkpreet.github.io/purrkour/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#191b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Purrkour">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: #191b3a;
    font-family: 'Baloo 2', 'Comic Sans MS', sans-serif;
    color: #fff6e0;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    position: fixed; inset: 0;
  }
  #game { position: absolute; inset: 0; display: block; touch-action: none; }
  .hidden { display: none !important; }
  button { font-family: inherit; border: 0; cursor: pointer; touch-action: manipulation; }

  /* ---------- screens ---------- */
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 18px);
    z-index: 10;
  }
  #title { justify-content: space-between; background: linear-gradient(rgba(20,20,45,0) 30%, rgba(15,15,35,0.55)); }
  #logo {
    position: relative; margin-top: 9vh; text-align: center;
    font-weight: 800; font-size: clamp(44px, 14vw, 84px); letter-spacing: 0.04em; line-height: 0.95;
    color: #fff6e0;
    background: linear-gradient(180deg, #fff6e0 25%, #ffe3a1 60%, #ffbe78 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #logo::before {
    content: 'PURRKOUR'; position: absolute; inset: 0; z-index: -1;
    -webkit-text-fill-color: rgba(255,217,138,0.01); color: rgba(255,217,138,0.01);
    text-shadow: 0 0 26px rgba(255,207,111,0.5), 0 4px 0 rgba(90,60,90,0.45);
  }
  #subtitle { text-align: center; font-size: clamp(15px, 4.4vw, 20px); color: #b8a6ff; margin-top: 6px; letter-spacing: 0.14em; }
  #subtitle::before { content: '\2726\2002'; color: #ffd98a; font-size: 0.8em; }
  #subtitle::after { content: '\2002\2726'; color: #ffd98a; font-size: 0.8em; }
  #title-btns { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
  #play-btn {
    font-size: clamp(20px, 6vw, 28px); font-weight: 800; letter-spacing: 0.06em;
    color: #3a2440; background: linear-gradient(#ffd98a, #ffb46b);
    padding: 18px 44px; border-radius: 999px;
    box-shadow: 0 6px 0 #c97f3c, 0 10px 30px rgba(255,207,111,0.35);
    animation: breathe 2.6s ease-in-out infinite;
  }
  #play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c97f3c; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .row { display: flex; gap: 12px; }
  .pill {
    font-size: 16px; font-weight: 700; color: #fff6e0;
    background: rgba(60,55,100,0.75); padding: 12px 22px; border-radius: 999px;
    box-shadow: inset 0 0 0 2px rgba(255,246,224,0.18);
  }
  .pill:active { transform: scale(0.95); }
  .toggle { width: 48px; height: 48px; border-radius: 50%; font-size: 20px; background: rgba(60,55,100,0.75); box-shadow: inset 0 0 0 2px rgba(255,246,224,0.18); }
  .toggle.off { opacity: 0.35; filter: grayscale(1); }
  #version { font-size: 12px; color: rgba(255,246,224,0.5); margin-top: 10px; }

  /* ---------- panels (map, shop) ---------- */
  .panel {
    background-color: #161340;
    background-image:
      radial-gradient(circle 1px at 20% 15%, rgba(255,246,224,0.5) 0 1px, transparent 1.5px),
      radial-gradient(circle 1px at 75% 40%, rgba(184,166,255,0.4) 0 1px, transparent 1.5px),
      radial-gradient(circle 1px at 45% 75%, rgba(255,246,224,0.3) 0 1px, transparent 1.5px),
      linear-gradient(180deg, #1a1840 0%, #131028 100%);
    background-size: 220px 260px, 180px 200px, 240px 220px, 100% 100%;
    z-index: 20; overflow-y: auto; touch-action: pan-y;
  }
  .panel-h { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 520px; margin-bottom: 6px; }
  .back { width: 44px; height: 44px; border-radius: 50%; font-size: 20px; font-weight: 800; color: #fff6e0; background: rgba(90,85,140,0.6); flex: none; }
  .panel-title { font-size: clamp(19px, 5.6vw, 26px); font-weight: 800; letter-spacing: 0.04em; }
  .panel-sub { font-size: 14px; color: #b8a6ff; width: 100%; max-width: 520px; margin-bottom: 12px; }

  #map-list { width: 100%; max-width: 520px; padding-bottom: 30px; }
  .district-h { font-size: 13px; font-weight: 800; letter-spacing: 0.18em; margin: 16px 0 8px; }
  .node-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .node {
    position: relative; border-radius: 16px; padding: 10px 4px 8px; text-align: center;
    background: rgba(70,65,120,0.55); color: #fff6e0; box-shadow: inset 0 0 0 2px rgba(255,246,224,0.14);
    background: color-mix(in srgb, var(--acc, #6a60a8) 10%, rgba(40,36,80,0.6));
    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--acc, #b8a6ff) 28%, transparent);
    display: flex; flex-direction: column; gap: 2px; min-height: 64px;
  }
  .node b { font-size: 19px; color: color-mix(in srgb, var(--acc, #ffd98a) 55%, #fff6e0); }
  .node i { font-style: normal; font-size: 9px; line-height: 1.1; opacity: 0.8; }
  .node.cleared { background: rgba(120,105,60,0.5); box-shadow: inset 0 0 0 2px rgba(255,217,138,0.5); }
  .node.cleared::after {
    content: '\1F43E'; position: absolute; top: -6px; right: -4px; font-size: 11px;
    transform: rotate(12deg);
  }
  .node.current { box-shadow: inset 0 0 0 2px #ffd98a, 0 0 18px rgba(255,217,138,0.35); animation: breathe 2s ease-in-out infinite; }
  .node.locked { opacity: 0.38; }
  .node .badge {
    position: absolute; top: -5px; left: -3px; width: 14px; height: 10px;
    background: #ff9fd0; border-radius: 50% 40% 40% 50%;
    clip-path: polygon(0 50%, 30% 0, 100% 20%, 78% 50%, 100% 80%, 30% 100%);
  }
  .endless-node {
    width: 100%; margin-top: 18px; border-radius: 18px; padding: 14px; text-align: center;
    background: linear-gradient(105deg, rgba(90,70,140,0.7), rgba(50,45,110,0.7));
    color: #fff6e0; box-shadow: inset 0 0 0 2px rgba(184,166,255,0.5);
    display: flex; flex-direction: column; gap: 4px;
  }
  .endless-node b { font-size: 18px; letter-spacing: 0.08em; }
  .endless-node i { font-style: normal; font-size: 12px; opacity: 0.8; }
  .endless-node.locked { opacity: 0.4; }

  #shop-list { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 30px; }
  .skin-card {
    display: flex; align-items: center; gap: 12px; border-radius: 20px; padding: 10px 12px;
    background: rgba(70,65,120,0.5); box-shadow: inset 0 0 0 2px rgba(255,246,224,0.12);
  }
  .skin-card.wearing { box-shadow: inset 0 0 0 2px #ffd98a; }
  .portrait { width: 64px; height: 64px; flex: none; background: rgba(30,28,60,0.6); border-radius: 16px; }
  .skin-info { flex: 1; min-width: 0; }
  .skin-info b { font-size: 17px; display: block; }
  .skin-info i { font-style: normal; font-size: 11.5px; opacity: 0.75; line-height: 1.2; display: block; }
  .skin-btn {
    flex: none; font-size: 13px; font-weight: 800; padding: 10px 14px; border-radius: 999px;
    background: rgba(120,110,180,0.55); color: #fff6e0; max-width: 132px;
  }
  .skin-btn.buy { background: linear-gradient(#ffd98a, #ffb46b); color: #3a2440; }
  .skin-btn.active { background: rgba(255,217,138,0.25); color: #ffd98a; }
  #shop-balance-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; font-weight: 800; font-size: 18px; color: #ffd98a; }

  .wobble { animation: wobble 0.4s ease; }
  @keyframes wobble { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-2deg); } 75% { transform: translateX(5px) rotate(2deg); } }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  #hud-top {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 12px; right: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  #level-chip {
    font-size: 13px; font-weight: 700; background: rgba(25,23,55,0.65); padding: 7px 12px; border-radius: 999px;
    box-shadow: inset 0 0 0 1.5px rgba(184,166,255,0.22);
  }
  #level-chip b { color: #ffd98a; margin-right: 5px; }
  #level-chip span { color: #fff6e0; opacity: 0.9; }
  #moonbar {
    flex: 1; height: 12px; background: rgba(25,23,55,0.65); border-radius: 999px; position: relative; overflow: visible;
    box-shadow: inset 0 0 0 1.5px rgba(184,166,255,0.25);
  }
  #moonbar-fill {
    position: relative; height: 100%; width: 0%; min-width: 12px; border-radius: 999px;
    background: linear-gradient(90deg, #b8a6ff, #ffd98a); transition: width 0.3s;
  }
  #moonbar-fill::after { /* a little moon-pearl walking toward the window */
    content: ''; position: absolute; right: -3px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; border-radius: 50%; background: #fff6e0;
    box-shadow: 0 0 9px rgba(255,246,224,0.85), inset -2px -2px 0 rgba(184,166,255,0.35);
  }
  #moonbar::after { /* Hana's window at the end of the way */
    content: ''; position: absolute; right: -4px; top: -4px; width: 14px; height: 18px;
    background: #ffcf6f; border-radius: 3px; box-shadow: 0 0 10px rgba(255,207,111,0.8), inset 0 0 0 1.5px rgba(90,60,60,0.6);
  }
  #moonbar.near::after { animation: breathe 1.1s ease-in-out infinite; }
  #coin-chip {
    display: flex; align-items: center; gap: 4px; background: rgba(25,23,55,0.65);
    padding: 4px 12px 4px 6px; border-radius: 999px; font-weight: 800; font-size: 16px; color: #ffd98a;
    box-shadow: inset 0 0 0 1.5px rgba(184,166,255,0.22);
  }
  #coin-chip.squish { animation: squish 0.25s ease; }
  @keyframes squish { 50% { transform: scale(1.25, 0.8); } }
  #coin-icon { width: 22px; height: 22px; }
  #pause-btn {
    pointer-events: auto; width: 38px; height: 38px; border-radius: 50%; font-size: 13px; font-weight: 800;
    background: rgba(25,23,55,0.65); color: #fff6e0;
    box-shadow: inset 0 0 0 1.5px rgba(184,166,255,0.22);
  }
  #dist-chip {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 50%; transform: translateX(-50%);
    font-size: 20px; font-weight: 800; color: #b8a6ff; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #tut {
    position: absolute; bottom: 24%; left: 50%; transform: translateX(-50%); z-index: 35;
    background: rgba(25,23,55,0.85); border-radius: 18px; padding: 12px 20px;
    font-size: 17px; font-weight: 700; color: #ffd98a; white-space: nowrap; max-width: 92vw; text-align: center; white-space: normal;
    border: 2px solid rgba(255,217,138,0.35);
    animation: popin 0.3s ease;
  }
  #tut::before { content: '\1F43E\2002'; font-size: 0.9em; }
  #tut::after { /* speech tail pointing down at Mochi */
    content: ''; position: absolute; left: 26%; bottom: -8px; width: 14px; height: 14px;
    background: rgba(25,23,55,0.85);
    border-right: 2px solid rgba(255,217,138,0.35); border-bottom: 2px solid rgba(255,217,138,0.35);
    transform: rotate(45deg);
  }
  @keyframes popin { from { transform: translateX(-50%) scale(0.6); opacity: 0; } }

  /* ---------- overlay cards ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 90% 70% at 50% 45%, rgba(25,13,42,0.3) 0%, rgba(14,8,28,0.72) 100%);
    padding: 24px;
  }
  .card {
    position: relative;
    background: #1e1c3e; border-radius: 26px; padding: 26px 26px 22px; text-align: center;
    width: min(92vw, 360px); box-shadow: 0 0 0 3px rgba(255,217,138,0.3), 0 18px 50px rgba(0,0,0,0.5);
    animation: popcard 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .card::before, .card::after { /* Mochi is telling you this herself */
    content: ''; position: absolute; top: -15px; width: 44px; height: 36px;
    background: radial-gradient(circle at 50% 88%, rgba(255,159,208,0.55) 0 34%, #1e1c3e 35%);
    border: 3px solid rgba(255,217,138,0.3); border-bottom: none;
    border-radius: 70% 70% 0 0 / 100% 100% 0 0;
  }
  .card::before { left: 34px; transform: rotate(-8deg); }
  .card::after { right: 34px; transform: rotate(8deg); }
  @keyframes popcard { from { transform: scale(0.6); opacity: 0; } }
  .card h2 { font-size: 27px; font-weight: 800; letter-spacing: 0.04em; color: #ffd98a; margin-bottom: 10px; }
  .card .stats { font-size: 17px; line-height: 1.5; margin-bottom: 18px; }
  .card .stats .pink { color: #ff9fd0; font-weight: 800; }
  .card .btns { display: flex; flex-direction: column; gap: 10px; }
  .btn-primary {
    font-size: 18px; font-weight: 800; padding: 14px; border-radius: 999px;
    background: linear-gradient(#ffd98a, #ffb46b); color: #3a2440; box-shadow: 0 4px 0 #c97f3c;
  }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #c97f3c; }
  .btn-ghost { font-size: 15px; font-weight: 700; padding: 12px; border-radius: 999px; background: rgba(120,110,180,0.4); color: #fff6e0; }
  #flop-line { font-size: 19px; font-weight: 700; line-height: 1.35; margin-bottom: 8px; }
  #flop-extra { font-size: 15px; color: #b8a6ff; margin-bottom: 12px; min-height: 1em; }
  #flop-tap { font-size: 15px; font-weight: 800; letter-spacing: 0.14em; color: #ffd98a; animation: breathe 1.4s ease-in-out infinite; }

  /* ---------- story ---------- */
  #story { background: #131530; z-index: 40; justify-content: center; gap: 18px; }
  #story-canvas { width: min(92vw, 420px); aspect-ratio: 1 / 1.05; border-radius: 26px; box-shadow: 0 0 0 3px rgba(184,166,255,0.3), 0 20px 60px rgba(0,0,0,0.6); }
  #story-caption { font-size: clamp(16px, 4.6vw, 21px); font-weight: 700; text-align: center; max-width: 420px; line-height: 1.4; }
  #story-hint { font-size: 13px; color: rgba(255,246,224,0.5); letter-spacing: 0.12em; animation: breathe 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hud-top">
    <div id="level-chip"><b>1</b><span>Bakery Roof</span></div>
    <div id="moonbar"><div id="moonbar-fill"></div></div>
    <div id="coin-chip"><canvas id="coin-icon" width="44" height="44"></canvas><span id="coin-count">0</span></div>
    <button id="pause-btn" aria-label="pause">&#10073;&#10073;</button>
  </div>
  <div id="dist-chip" class="hidden">0 m</div>
</div>
<div id="tut" class="hidden"></div>

<div id="title" class="screen">
  <div>
    <div id="logo">PURRKOUR</div>
    <div id="subtitle">a rooftop lullaby</div>
  </div>
  <div id="title-btns">
    <button id="play-btn">&#128062; TAP TO PLAY</button>
    <div class="row">
      <button id="shop-btn" class="pill">THE YARN SHOP</button>
      <button id="map-btn" class="pill">ROOFTOPS</button>
    </div>
    <div class="row">
      <button id="snd-btn" class="toggle" aria-label="sound">&#128266;</button>
      <button id="mus-btn" class="toggle" aria-label="music">&#127925;</button>
    </div>
    <div id="version">Purrkour v1.0 - made with love for Hana</div>
  </div>
</div>

<div id="map" class="screen panel hidden">
  <div class="panel-h">
    <button id="map-back" class="back">&#8592;</button>
    <div class="panel-title">THE WAY TO HANA'S WINDOW</div>
  </div>
  <div id="map-list"></div>
</div>

<div id="shop" class="screen panel hidden">
  <div class="panel-h">
    <button id="shop-back" class="back">&#8592;</button>
    <div class="panel-title">THE YARN SHOP</div>
    <div id="shop-balance-wrap">&#128031; <span id="shop-balance">0</span></div>
  </div>
  <div class="panel-sub">spend your fish, wear your dreams</div>
  <div id="shop-list"></div>
</div>

<div id="story" class="screen hidden">
  <canvas id="story-canvas"></canvas>
  <div id="story-caption"></div>
  <div id="story-hint">TAP TO CONTINUE</div>
</div>

<div id="clear-card" class="overlay hidden">
  <div class="card">
    <h2>LEVEL CLEAR!</h2>
    <div id="clear-stats" class="stats"></div>
    <div class="btns">
      <button id="next-btn" class="btn-primary">NEXT ROOF</button>
      <button id="replay-btn" class="btn-ghost">REPLAY</button>
      <button id="clear-map-btn" class="btn-ghost">ROOFTOPS</button>
    </div>
  </div>
</div>

<div id="flop-card" class="overlay hidden">
  <div class="card">
    <div id="flop-line"></div>
    <div id="flop-extra"></div>
    <div id="flop-tap">TAP TO RETRY</div>
  </div>
</div>

<div id="pause-card" class="overlay hidden">
  <div class="card">
    <h2>CAT NAP</h2>
    <div class="btns">
      <button id="resume-btn" class="btn-primary">KEEP RUNNING</button>
      <button id="leave-btn" class="btn-ghost">LEAVE LEVEL</button>
    </div>
  </div>
</div>

<noscript>Purrkour needs JavaScript to purr.</noscript>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
