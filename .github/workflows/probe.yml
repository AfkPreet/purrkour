name: probe-url
on:
  push:
    branches:
      - claude/purrkour-mobile-game-bqelb8

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe URLs as an anonymous visitor
        run: |
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            out=$(curl -s -o body.out -w '%{http_code} %{content_type}' -L --max-time 30 "$url")
            echo "PROBE $url -> $out ($(wc -c < body.out) bytes)"
          done < tools/probe-urls.txt
