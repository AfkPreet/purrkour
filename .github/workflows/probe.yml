name: probe-url
on:
  push:
    branches:
      - claude/purrkour-mobile-game-bqelb8

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe URLs as an anonymous visitor
        run: |
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -s -o body.html -w '%{http_code}' -L --max-time 30 "$url")
            echo "PROBE $url -> HTTP $code"
            echo "  TITLE: $(grep -o '<title>[^<]*</title>' body.html | head -1)"
            echo "  BYTES: $(wc -c < body.html)"
          done < tools/probe-urls.txt
